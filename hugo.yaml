baseURL: https://docs.ulai.co.in/
title: Ulai Docs

enableRobotsTXT: true
# Gives values to .Lastmod etc. (requires full git history in CI).
enableGitInfo: true

taxonomies:
  tag: tags
  category: categories

permalinks:
  blog: /:section/:year/:month/:day/:slugorcontentbasename

imaging:
  resampleFilter: CatmullRom

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
    # Resolve root-relative content links (e.g. /docs/...) to page permalinks,
    # so they resolve correctly whatever the site's base path is.
    renderHooks:
      link:
        useEmbedded: always
      image:
        useEmbedded: always
  highlight:
    style: tango
    noClasses: false # Required for dark-mode support of code blocks

outputs:
  home: [HTML, print, RSS]
  section: [HTML, print, RSS]

params:
  description: >-
    Documentation for the Ulai SIP Gateway — SIP trunks in, Ulai SFU voice
    rooms out.

  # No tagged content yet; empty lists switch the taxonomy UI off entirely.
  taxonomy:
    taxonomyCloud: []
    taxonomyCloudTitle: []
    taxonomyPageHeader: []

  # This site's own repo — drives the "Edit this page" links.
  github_repo: https://github.com/ulaidotin/ulaidotin
  github_branch: main

  # The project being documented — drives "Create project issue".
  github_project_repo: https://github.com/ulaidotin/ulai-sip-module

  # Lunr.js offline search (no external search service needed).
  offlineSearch: true

  prism_syntax_highlighting: false

  copyright:
    authors: Ulai | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0) |
    from_year: 2026
    to_year: present

  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    sidebar_menu_foldable: true
    sidebar_menu_compact: false
    sidebar_search_disable: false
    showLightDarkModeMenu: true
    feedback:
      enable: false
    readingtime:
      enable: false

  # Docs helpers: use with _param
  btn-lg: class="btn btn-lg btn-{1}" role="button"
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>

  links:
    developer:
      - name: SIP Gateway on GitHub
        url: https://github.com/ulaidotin/ulai-sip-module
        icon: fab fa-github
        desc: Source for the gateway documented here
      - name: Docs on GitHub
        url: https://github.com/ulaidotin/ulaidotin
        icon: fab fa-github
        desc: Source for this site

module:
  hugoVersion:
    extended: true
    min: 0.160.1
  imports:
    - path: github.com/google/docsy/theme
      disable: false
