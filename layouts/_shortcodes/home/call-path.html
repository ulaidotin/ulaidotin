{{- /* The path a phone call takes through Ulai: left to right on wide screens,
  top to bottom on narrow ones. The two modules are the highlighted, linked
  steps. */ -}}
{{ $sip := partial "home/href.html" "/docs/sip/" -}}
{{ $agent := partial "home/href.html" "/docs/agent-server/" -}}
<figure class="ulai-call-path">
  <div class="ulai-call-path__track">
    <div class="ulai-node">
      <span class="ulai-node__icon"><i class="fa-solid fa-phone" aria-hidden="true"></i></span>
      <span class="ulai-node__name">Caller</span>
      <span class="ulai-node__note">on the phone network</span>
    </div>
    <div class="ulai-hop"><span>SIP · RTP</span></div>
    <a class="ulai-node ulai-node--module" href="{{ $sip }}">
      <span class="ulai-node__icon"><i class="fa-solid fa-phone-volume" aria-hidden="true"></i></span>
      <span class="ulai-node__name">SIP Gateway</span>
      <span class="ulai-node__note">answers and dials</span>
    </a>
    <div class="ulai-hop"><span>WebRTC</span></div>
    <div class="ulai-node">
      <span class="ulai-node__icon"><i class="fa-solid fa-people-group" aria-hidden="true"></i></span>
      <span class="ulai-node__name">Ulai SFU room</span>
      <span class="ulai-node__note">where everyone meets</span>
    </div>
    <div class="ulai-hop"><span>WebSocket</span></div>
    <a class="ulai-node ulai-node--module" href="{{ $agent }}">
      <span class="ulai-node__icon"><i class="fa-solid fa-wave-square" aria-hidden="true"></i></span>
      <span class="ulai-node__name">Agent Server</span>
      <span class="ulai-node__note">runs the conversation</span>
    </a>
    <div class="ulai-hop"><span>streaming</span></div>
    <div class="ulai-node">
      <span class="ulai-node__icon"><i class="fa-solid fa-brain" aria-hidden="true"></i></span>
      <span class="ulai-node__name">AI backend</span>
      <span class="ulai-node__note">Gemini Live, …</span>
    </div>
  </div>
  <figcaption>How a phone call reaches an AI agent. The highlighted components are the ones these docs show you how to deploy.</figcaption>
</figure>
